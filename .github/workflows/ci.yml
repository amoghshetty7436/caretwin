name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/caretwin-dev
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caretwin
          POSTGRES_PASSWORD: caretwin
          POSTGRES_DB: caretwin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caretwin" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests ../eval ../scripts
      - name: Unit + integration tests (coverage gate 85%)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Assistant eval (offline planner, 50 questions + 20 held-out)
        run: |
          python -m app.seed > /dev/null
          # gold answers come from independent Cypher in build_gold.py; rebuild them if the
          # seeded census differs from the committed fingerprint (e.g. library version drift)
          python ../eval/run_eval.py || (python ../eval/build_gold.py && python ../eval/run_eval.py)
          python ../eval/run_eval.py --questions ../eval/questions_heldout.jsonl --out ../eval/results/offline_heldout.json
      - name: Impact-query benchmark
        run: python ../scripts/bench_impact.py --rounds 2
      - uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            eval/results/
            docs/results/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: caretwin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: caretwin-web:ci
