name: LLM assistant eval

# Manual. Scores an OpenAI-compatible LLM (default: Groq free tier) on the same
# 50 questions + 20 held-out paraphrases as the offline planner, then commits the
# JSON results to eval/results/. Requires repo secret LLM_API_KEY.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id, or "auto" to pick a tool-calling model the key can use
        default: auto
        required: true
      base_url:
        description: OpenAI-compatible base URL
        default: https://api.groq.com/openai/v1
        required: true

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/caretwin-dev
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      CARETWIN_LLM_PROVIDER: openai_compat
      CARETWIN_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      CARETWIN_LLM_BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Choose model
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          base, want = os.environ["CARETWIN_LLM_BASE_URL"].rstrip("/"), "${{ inputs.model }}"
          req = urllib.request.Request(f"{base}/models",
                                       headers={"Authorization": f"Bearer {os.environ['CARETWIN_LLM_API_KEY']}"})
          ids = sorted(m["id"] for m in json.load(urllib.request.urlopen(req))["data"])
          print("available models:", ", ".join(ids))
          prefer = ["openai/gpt-oss-120b", "llama-3.3-70b-versatile", "moonshotai/kimi-k2-instruct-0905",
                    "moonshotai/kimi-k2-instruct", "qwen/qwen3-32b", "meta-llama/llama-4-maverick-17b-128e-instruct",
                    "openai/gpt-oss-20b", "meta-llama/llama-4-scout-17b-16e-instruct"]
          if want != "auto":
              model = want
          else:
              model = next((m for m in prefer if m in ids), None) or next(
                  m for m in ids if not any(x in m for x in ("whisper", "tts", "guard", "embed", "orpheus")))
          print("using model:", model)
          open(os.environ["GITHUB_ENV"], "a").write(f"CARETWIN_LLM_MODEL={model}\n")
          EOF
      - name: Seed twin (Postgres is optional for the eval)
        run: python -m app.seed > /dev/null
      - name: Score LLM
        run: |
          python ../eval/run_eval.py || (python ../eval/build_gold.py && python ../eval/run_eval.py)
          python ../eval/run_eval.py --questions ../eval/questions_heldout.jsonl \
            --out "../eval/results/llm_heldout.json"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          for f in sorted(glob.glob("../eval/results/*.json")):
              r = json.load(open(f))
              print(f"- `{f.split('/')[-1]}` {r['provider']}: **{r['correct']}/{r['total']}** "
                    f"({r['accuracy']:.0%}), grounded {r['grounded_rate']:.0%}, p95 {r['p95_latency_ms']} ms, {r['by_category']}")
          EOF
      - name: Commit results
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results
          git diff --cached --quiet || git commit -m "eval: LLM assistant results ($CARETWIN_LLM_MODEL)"
          git push
